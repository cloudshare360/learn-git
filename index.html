<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learn computer basics, Git, GitHub, and web development by publishing a portfolio site.">
    <meta name="theme-color" content="#172554">
    <title>Git & GitHub — Zero to Published</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#lesson">Skip to lesson</a>

    <header class="topbar">
      <a class="brand" href="#/welcome" aria-label="Git and GitHub course home">
        <img src="assets/logo.svg" width="36" height="36" alt="">
        <span><strong>Zero to Published</strong><small>Git, GitHub & the Web</small></span>
      </a>

      <div class="topbar-actions">
        <button class="icon-button mobile-only" id="course-menu-button" type="button" aria-expanded="false" aria-controls="course-panel">
          <span aria-hidden="true">☰</span><span class="sr-only">Open course contents</span>
        </button>
        <label class="compact-field">System
          <select id="os-select" aria-label="Operating system">
            <option value="windows">Windows</option>
            <option value="macos">macOS</option>
            <option value="linux">Linux</option>
          </select>
        </label>
        <label class="compact-field" id="shell-field">Shell
          <select id="shell-select" aria-label="Terminal shell"></select>
        </label>
        <button class="icon-button" id="theme-button" type="button" aria-label="Switch to dark theme" title="Change color theme">◐</button>
        <button class="icon-button mobile-only" id="tools-menu-button" type="button" aria-expanded="false" aria-controls="tools-panel">
          <span aria-hidden="true">⌘</span><span class="sr-only">Open lesson tools</span>
        </button>
      </div>
    </header>

    <div class="app-shell">
      <aside class="course-panel" id="course-panel" aria-label="Course contents">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Your learning path</p>
            <h2>Course contents</h2>
          </div>
          <button class="close-panel mobile-only" type="button" data-close="course-panel" aria-label="Close course contents">×</button>
        </div>

        <label class="search-box" for="course-search">
          <span class="sr-only">Search lessons and commands</span>
          <span aria-hidden="true">⌕</span>
          <input id="course-search" type="search" placeholder="Search the course…" autocomplete="off">
        </label>

        <div class="progress-card" aria-labelledby="progress-label">
          <div><span id="progress-label">Course progress</span><strong id="progress-text">0%</strong></div>
          <progress id="course-progress" value="0" max="100">0%</progress>
          <button class="text-button" id="review-button" type="button">Review items <span id="review-count">0</span></button>
        </div>

        <nav id="course-tree" class="course-tree" aria-label="Expandable course tree"></nav>
        <p id="search-empty" class="empty-state" hidden>No lessons match that search.</p>
      </aside>

      <main id="lesson" class="lesson-panel" tabindex="-1">
        <noscript>
          <section class="notice danger">
            <h1>JavaScript is required for the interactive course</h1>
            <p>The lesson text remains in the project source, but navigation, operating-system variants, quizzes, and progress tracking need JavaScript enabled.</p>
          </section>
        </noscript>
        <div id="lesson-content" aria-live="polite">
          <section class="loading-state">
            <div class="spinner" aria-hidden="true"></div>
            <h1>Loading the course…</h1>
          </section>
        </div>
      </main>

      <aside class="tools-panel" id="tools-panel" aria-label="Lesson tools">
        <div class="panel-heading mobile-only">
          <h2>Lesson tools</h2>
          <button class="close-panel" type="button" data-close="tools-panel" aria-label="Close lesson tools">×</button>
        </div>
        <section class="tool-card" aria-labelledby="on-page-heading">
          <h2 id="on-page-heading">On this page</h2>
          <nav id="on-page-nav" aria-label="Lesson sections"></nav>
        </section>
        <section class="tool-card" aria-labelledby="terms-heading">
          <h2 id="terms-heading">New terms</h2>
          <dl id="terms-list"><div><dt>Course</dt><dd>A sequence of lessons with one practical goal.</dd></div></dl>
        </section>
        <section class="tool-card quick-actions" aria-labelledby="actions-heading">
          <h2 id="actions-heading">Progress & data</h2>
          <button id="complete-button" type="button" class="primary-button">Mark lesson complete</button>
          <button id="export-button" type="button" class="secondary-button">Export progress</button>
          <button id="reset-button" type="button" class="danger-button">Reset progress</button>
        </section>
      </aside>
    </div>

    <div id="panel-backdrop" class="panel-backdrop" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
